[project]
name = "pa-aa-ner-flooding"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "azure-storage-blob",
    "cdsapi",
    "fiona",
    "fsspec",
    "geopandas",
    "matplotlib",
    "numpy",
    "ocha-anticipy",
    "ocha-stratus",
    "pandas",
    "plotly",
    "rasterstats",
    "requests",
    "rioxarray",
    "scipy",
    "tqdm",
    "unidecode",
    "xarray",
]

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79

[dependency-groups]
dev = [
    "jupyter==1.0.0",
    "jupytext==1.11.1",
    "jupyter-black==0.3.1",
    "pre-commit==2.15.0",
]
